name: Compilar Top Gear para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar Launcher
        run: cmake --build build --config Release --target topgear-launcher

      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: Top-Gear-Windows
          path: build/Release/Launcher.exe
