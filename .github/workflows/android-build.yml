
name: Top Gear - Android Core Build

on:
  workflow_dispatch:
  push:
    paths:
      - "static-recomp/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android-core:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

        
      - name: Corrigir expressões hexadecimais para Clang
        run: |
          FILE="static-recomp/src/topgear_mod_rivals.c"
          sed -E -i \
            's/(0[xX][0-9a-fA-F]+)[+]([[:alpha:]_])/\1 + \2/g' \
            "$FILE"
          grep -nE '0[xX][0-9a-fA-F]+\+[[:alpha:]_]' "$FILE" \
            && { echo "Ainda existem expressões sem espaço"; exit 1; } \
            || echo "Correção verificada"


      - name: Instalar CMake e Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configurar Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Configurar compilação ARM64
        run: |
          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_FLAGS="-Wno-error=misleading-indentation

      - name: Compilar núcleo
        run: |
          cmake --build build-android \
            --target topgear-static-recomp \
            --parallel 2

      - name: Localizar biblioteca gerada
        run: |
          find build-android -type f \
            -name "libtopgear-static-recomp.a" -print

      - name: Publicar núcleo compilado
        uses: actions/upload-artifact@v4
        with:
          name: topgear-android-arm64-core
          path: build-android/**/libtopgear-static-recomp.a
          if-no-files-found: error
          retention-days: 7
          
